<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Molju — Premium Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root{--bg:#080808;--surf:#121212;--surf2:#1c1c1e;--glass:rgba(18,18,18,0.85);--brd:rgba(255,255,255,0.08);--txt:#fff;--mut:#8e8e93;--acc:#ff3b30;--acc-glow:rgba(255,59,48,0.4);--grad:linear-gradient(135deg,#ff3b30,#b30000);--msg-mine:linear-gradient(135deg,#ff3b30,#cc0000);--msg-other:#262628;--verified:#0088cc;--story-seen:#555}
body.light{--bg:#f2f2f7;--surf:#fff;--surf2:#e5e5ea;--glass:rgba(255,255,255,0.85);--brd:rgba(0,0,0,0.1);--txt:#000;--mut:#8e8e93;--msg-other:#e5e5ea;--story-seen:#ccc}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--txt);overflow:hidden;display:flex;justify-content:center}
.app{position:relative;width:100%;height:100%;max-width:480px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:10}
.scr.act{display:flex;animation:fadeIn 0.2s}
button{border:none;background:none;color:inherit;font-family:inherit;cursor:pointer;outline:none;transition:0.2s;display:flex;align-items:center;justify-content:center}
button:active{transform:scale(0.95);opacity:0.8}
.btn{padding:16px 24px;border-radius:16px;font-weight:600;font-size:16px;width:100%}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 4px 15px var(--acc-glow)}
.btn-g{background:var(--surf2);color:var(--txt);border:1px solid var(--brd)}
.inp{width:100%;padding:16px;border-radius:16px;background:var(--surf2);border:1px solid var(--brd);color:var(--txt);font-size:16px;outline:none;margin-bottom:16px}
.inp:focus{border-color:var(--acc)}
.ava{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;background:var(--grad);flex-shrink:0;background-size:cover;background-position:center}
.ava-sm{width:36px;height:36px;font-size:14px}
.ava-lg{width:96px;height:96px;font-size:36px}
.ver{color:var(--verified);font-size:18px;margin-left:4px}
.loader{width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
#scr-auth{align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
.logo{font-size:56px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.auth-step{width:100%;display:none;flex-direction:column;animation:fadeIn 0.3s}
.auth-step.act{display:flex}
.hdr{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:20}
.hdr-title{font-size:22px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surf2);font-size:20px}
.content{flex:1;overflow-y:auto;padding:0 16px 100px}
.tab{display:none}.tab.act{display:block;animation:fadeIn 0.3s}
.s-bar{width:100%;padding:12px 16px;border-radius:16px;background:var(--surf2);display:flex;align-items:center;gap:10px;margin:16px 0}
.s-bar input{background:none;border:none;color:var(--txt);width:100%;outline:none;font-size:15px}
.chat-list{display:flex;flex-direction:column;gap:4px}
.chat-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;cursor:pointer}
.chat-item:active{background:var(--surf2)}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:16px;font-weight:600;display:flex;align-items:center}
.chat-last{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--brd);z-index:30}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:11px;width:70px}
.nav-btn.act{color:var(--acc)}
.nav-btn i{font-size:24px}
.fab{position:absolute;right:20px;bottom:90px;width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;font-size:24px;box-shadow:0 6px 20px var(--acc-glow);z-index:25}
.chat-hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);z-index:20}
.back-btn{font-size:24px;padding:8px;margin-left:-8px}
.chat-hdr-name{font-size:16px;font-weight:600;display:flex;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;position:relative;word-break:break-word;display:flex;flex-direction:column;animation:popIn 0.2s}
.msg-other{align-self:flex-start;background:var(--msg-other);border-bottom-left-radius:4px}
.msg-mine{align-self:flex-end;background:var(--msg-mine);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:10px;opacity:0.7;align-self:flex-end;margin-top:4px}
.input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--brd);display:flex;gap:10px;align-items:flex-end;z-index:20}
.input-bar input{flex:1;background:var(--surf2);border:1px solid var(--brd);padding:14px 18px;border-radius:24px;color:var(--txt);outline:none}
.send-btn{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;font-size:24px;flex-shrink:0}
.mdl-bg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:50}
.mdl-bg.act{display:flex;animation:fadeIn 0.15s}
.mdl{width:100%;background:var(--surf);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));animation:popIn 0.25s;border-top:1px solid var(--brd);max-height:90vh;overflow-y:auto}
.mdl-title{font-size:20px;font-weight:700;margin-bottom:20px}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--brd);cursor:pointer}
.setting-text{flex:1;font-size:16px;margin-left:12px}
#toast{position:absolute;bottom:100px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1000;pointer-events:none}
.toast-msg{background:var(--surf2);color:var(--txt);padding:12px 20px;border-radius:30px;font-size:14px;font-weight:500;border:1px solid var(--brd);animation:popIn 0.2s}
.stories-row{display:flex;gap:16px;overflow-x:auto;padding:16px 0;border-bottom:1px solid var(--brd);margin-bottom:16px}
.stories-row::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;cursor:pointer}
.story-circle{width:64px;height:64px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid transparent;background-size:cover;background-position:center}
.story-circle.add{border:2px dashed var(--mut);color:var(--mut)}
.story-circle.has{border:2px solid var(--acc)}
.story-name{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center;display:flex;justify-content:center;align-items:center}
#story-viewer{position:absolute;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#story-viewer.act{display:flex}
.story-progress{position:absolute;top:10px;left:10px;right:10px;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;z-index:20}
.story-progress-bar{height:100%;background:#fff;width:0%;animation:progress 10s linear forwards}
@keyframes progress{from{width:0%}to{width:100%}}
.story-header{position:absolute;top:0;left:0;right:0;padding:20px;display:flex;align-items:center;gap:12px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);z-index:20}
.story-media{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.story-media img,.story-media video{max-width:100%;max-height:100%;object-fit:contain}
.story-text{position:absolute;bottom:30%;width:100%;text-align:center;font-size:24px;font-weight:600;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.8);padding:0 20px}
.story-tap{position:absolute;inset:0;display:flex;z-index:15}
.story-tap div{flex:1;height:100%}
</style>
</head>
<body>
<div class="app">
<div id="toast"></div>

<!-- AUTH -->
<div id="scr-auth" class="scr act">
<div class="auth-box">
<div class="logo">Molju</div>
<div style="color:var(--mut);margin-bottom:30px;text-align:center">Безопасный мессенджер</div>
<div class="auth-step act" id="step-email">
<input type="email" id="inp-email" class="inp" placeholder="Email">
<button class="btn btn-p" id="btn-send">Получить код</button>
</div>
<div class="auth-step" id="step-otp">
<p style="text-align:center;color:var(--mut);margin-bottom:20px">Код отправлен на <b id="disp-email"></b></p>
<input type="text" id="inp-otp" class="inp" placeholder="000000" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:5px">
<button class="btn btn-p" id="btn-verify">Войти</button>
</div>
<div class="auth-step" id="step-profile">
<p style="text-align:center;color:var(--mut);margin-bottom:20px">Создайте профиль</p>
<input type="text" id="inp-username" class="inp" placeholder="@username">
<input type="text" id="inp-name" class="inp" placeholder="Имя">
<button class="btn btn-p" id="btn-save-profile">Создать аккаунт</button>
</div>
</div>
</div>

<!-- MAIN -->
<div id="scr-main" class="scr">
<div class="hdr"><div class="hdr-title" id="main-title">Molju</div><button class="icon-btn" onclick="openModal('mdl-new-chat')"><i class="ph ph-plus"></i></button></div>
<div class="content tab act" id="tab-chats">
<div class="stories-row" id="stories-container"></div>
<div class="s-bar"><i class="ph ph-magnifying-glass" style="color:var(--mut)"></i><input type="text" id="search-inp" placeholder="Поиск..."></div>
<div class="chat-list" id="chat-list"></div>
</div>
<div class="content tab" id="tab-settings">
<div class="setting-item" onclick="toggleTheme()"><div style="display:flex;align-items:center"><i class="ph ph-moon" style="font-size:22px"></i><div class="setting-text">Тёмная тема</div></div><input type="checkbox" id="theme-toggle" style="width:20px;height:20px;accent-color:var(--acc)"></div>
</div>
<div class="content tab" id="tab-profile">
<div style="display:flex;flex-direction:column;align-items:center;margin-top:40px">
<div class="ava ava-lg" id="profile-ava"></div>
<div style="font-size:24px;font-weight:700;margin-top:16px;display:flex;align-items:center" id="profile-name">Имя</div>
<div style="color:var(--mut);margin-top:4px" id="profile-username">@username</div>
<button class="btn btn-g" style="margin-top:40px;color:var(--acc)" id="btn-logout">Выйти</button>
</div>
</div>
<div class="nav-bar">
<button class="nav-btn act" onclick="switchTab('chats',this)"><i class="ph ph-chats"></i><span>Чаты</span></button>
<button class="nav-btn" onclick="switchTab('settings',this)"><i class="ph ph-gear"></i><span>Настройки</span></button>
<button class="nav-btn" onclick="switchTab('profile',this)"><i class="ph ph-user"></i><span>Профиль</span></button>
</div>
</div>

<!-- CHAT -->
<div id="scr-chat" class="scr">
<div class="chat-hdr">
<button class="back-btn" id="btn-back"><i class="ph ph-caret-left"></i></button>
<div class="ava ava-sm" id="chat-ava">?</div>
<div style="flex:1"><div class="chat-hdr-name" id="chat-name">Загрузка...</div></div>
</div>
<div class="msgs" id="msgs"></div>
<div class="input-bar">
<input type="text" id="msg-inp" placeholder="Сообщение...">
<button class="send-btn" id="btn-send-msg"><i class="ph ph-paper-plane-right"></i></button>
</div>
</div>

<!-- MODALS -->
<div id="mdl-new-chat" class="mdl-bg" onclick="closeModal('mdl-new-chat',event)">
<div class="mdl">
<div class="mdl-title">Новый чат</div>
<input type="text" id="new-chat-name" class="inp" placeholder="Имя собеседника">
<button class="btn btn-p" id="btn-create-chat">Создать</button>
</div>
</div>

<div id="mdl-add-story" class="mdl-bg" onclick="closeModal('mdl-add-story',event)">
<div class="mdl">
<div class="mdl-title">Новая история</div>
<button class="btn btn-g" style="margin-bottom:16px" onclick="document.getElementById('story-file').click()" id="story-file-btn">Выбрать фото/видео</button>
<input type="file" id="story-file" style="display:none" accept="image/*,video/*">
<input type="text" id="story-text" class="inp" placeholder="Текст (необязательно)">
<select id="story-vis" class="inp">
<option value="all">Кто увидит: Все</option>
<option value="contacts">Только контакты</option>
</select>
<button class="btn btn-p" id="btn-publish-story">Опубликовать</button>
</div>
</div>

</div>

<script>
(function(){
'use strict';
const SB_URL='https://dhmqbjfzkrmsbrwzenna.supabase.co',SB_KEY='sb_publishable_UddiQCyX7-rYk12LKAC3zg_NfuzGNcI';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:true,persistSession:true}});
let user=null,chatId=null,email='',currentProfile=null;
let activeStories=[],storyIndex=0,storyTimer=null;
let currentStoryFile=null,currentStoryType='image';

function toast(msg){const c=document.getElementById('toast');const t=document.createElement('div');t.className='toast-msg';t.innerHTML=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3000)}
function showScreen(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('act'));document.getElementById(id).classList.add('act')}
function showStep(id){document.querySelectorAll('.auth-step').forEach(s=>s.classList.remove('act'));document.getElementById(id).classList.add('act')}
window.switchTab=function(t,el){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('act'));if(el)el.classList.add('act');document.querySelectorAll('.tab').forEach(c=>c.classList.remove('act'));document.getElementById('tab-'+t).classList.add('act');document.getElementById('main-title').textContent=t==='chats'?'Molju':t==='settings'?'Настройки':'Профиль'};
window.toggleTheme=function(){document.body.classList.toggle('light');const isLight=document.body.classList.contains('light');localStorage.setItem('molju_theme',isLight?'light':'dark');document.getElementById('theme-toggle').checked=!isLight};
window.openModal=function(id){document.getElementById(id).classList.add('act')};
window.closeModal=function(id,e){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('act')};

// AUTH
document.getElementById('btn-send').onclick=async function(){email=document.getElementById('inp-email').value.trim();if(!email)return toast('Введите Email');this.innerHTML='<div class="loader"></div>';this.disabled=true;const{error}=await sb.auth.signInWithOtp({email});this.innerHTML='Получить код';this.disabled=false;if(error)return toast(error.message);document.getElementById('disp-email').textContent=email;showStep('step-otp')};
document.getElementById('btn-verify').onclick=async function(){const code=document.getElementById('inp-otp').value.trim();if(code.length<6)return toast('Введите код');this.innerHTML='<div class="loader"></div>';this.disabled=true;const{error}=await sb.auth.verifyOtp({email,token:code,type:'email'});this.innerHTML='Войти';this.disabled=false;if(error)toast(error.message)};

sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session){user=session.user;await checkProfile()}else if(event==='SIGNED_OUT'){user=null;showScreen('scr-auth')}});

async function checkProfile(){
const{data}=await sb.from('profiles').select('*').eq('id',user.id).single();
if(data&&data.username){
currentProfile=data;
document.getElementById('profile-name').innerHTML=`${data.name} ${data.is_verified?'<i class="ph-fill ph-seal-check ver"></i>':''}`;
document.getElementById('profile-username').textContent='@'+data.username;
if(data.avatar_url)document.getElementById('profile-ava').style.backgroundImage=`url('${data.avatar_url}')`;
showScreen('scr-main');loadChats();loadStories();
}else{showStep('step-profile')}
}

document.getElementById('btn-save-profile').onclick=async function(){const username=document.getElementById('inp-username').value.trim().replace(/[^a-z0-9_]/g,'');const name=document.getElementById('inp-name').value.trim();if(username.length<3)return toast('Юзернейм от 3 символов');if(!name)return toast('Введите имя');this.innerHTML='<div class="loader"></div>';this.disabled=true;const{error}=await sb.from('profiles').insert({id:user.id,username,name});this.innerHTML='Создать аккаунт';this.disabled=false;if(error)return toast(error.code==='23505'?'Занято':error.message);await checkProfile()};

document.getElementById('btn-logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

// CHATS
async function loadChats(){
const{data}=await sb.from('chat_members').select('chat_id,chats(id,name)').eq('user_id',user.id);
const c=document.getElementById('chat-list');c.innerHTML='';
if(!data||data.length===0){c.innerHTML='<div style="text-align:center;color:var(--mut);margin-top:40px">Нет чатов</div>';return}
data.forEach(item=>{const ch=item.chats;if(!ch)return;const el=document.createElement('div');el.className='chat-item';el.innerHTML=`<div class="ava">${ch.name[0].toUpperCase()}</div><div class="chat-info"><div class="chat-name">${ch.name}</div></div>`;el.onclick=()=>openChat(ch.id,ch.name);c.appendChild(el)});
}

async function openChat(id,name){
chatId=id;document.getElementById('chat-name').textContent=name;showScreen('scr-chat');
const{data}=await sb.from('messages').select('*').eq('chat_id',id).order('created_at',{ascending:true});
const c=document.getElementById('msgs');c.innerHTML='';
if(data){data.forEach(m=>{const isMine=m.sender_id===user.id;c.innerHTML+=`<div class="msg ${isMine?'msg-mine':'msg-other'}">${m.text}<span class="msg-time">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`});c.scrollTop=c.scrollHeight}
}

document.getElementById('btn-back').onclick=()=>{showScreen('scr-main');loadChats()};

document.getElementById('btn-send-msg').onclick=async()=>{
const inp=document.getElementById('msg-inp');const txt=inp.value.trim();if(!txt||!chatId)return;
inp.value='';
const{data}=await sb.from('messages').insert({chat_id:chatId,sender_id:user.id,text:txt}).select().single();
if(data){const c=document.getElementById('msgs');c.innerHTML+=`<div class="msg msg-mine">${txt}<span class="msg-time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`;c.scrollTop=c.scrollHeight}
};
document.getElementById('msg-inp').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('btn-send-msg').click()});

// CREATE CHAT
document.getElementById('btn-create-chat').onclick=async function(){
const name=document.getElementById('new-chat-name').value.trim();if(!name)return toast('Введите имя');
this.innerHTML='...';this.disabled=true;
const{data:ch,error}=await sb.from('chats').insert({type:'user',name,owner_id:user.id}).select().single();
if(error){toast(error.message);this.innerHTML='Создать';this.disabled=false;return}
await sb.from('chat_members').insert({chat_id:ch.id,user_id:user.id});
this.innerHTML='Создать';this.disabled=false;closeModal('mdl-new-chat');loadChats();openChat(ch.id,ch.name);
};

// STORIES
async function loadStories(){
const cont=document.getElementById('stories-container');
cont.innerHTML=`<div class="story-item" onclick="openModal('mdl-add-story')"><div class="story-circle add"><i class="ph ph-plus"></i></div><div class="story-name">Добавить</div></div>`;
const{data}=await sb.from('stories').select('*,profiles(username,avatar_url,is_verified)').order('created_at',{ascending:true});
if(!data)return;
const now=new Date().getTime();
const grouped={};
data.forEach(s=>{
const hours=(now-new Date(s.created_at).getTime())/36e5;
if(hours>48)return; // 48 hours filter
if(!grouped[s.user_id])grouped[s.user_id]=[];
grouped[s.user_id].push(s);
});
for(const uid in grouped){
const stories=grouped[uid];const latest=stories[stories.length-1];
const item=document.createElement('div');item.className='story-item';item.onclick=()=>openStoryViewer(stories,0);
const ava=latest.profiles?.avatar_url||`https://ui-avatars.com/api/?name=${latest.profiles?.username}&background=ff3b30&color=fff`;
const badge=latest.profiles?.is_verified?'<i class="ph-fill ph-seal-check ver"></i>':'';
item.innerHTML=`<div class="story-circle has" style="background-image:url('${ava}')"></div><div class="story-name">${uid===user.id?'Моя':latest.profiles?.username} ${badge}</div>`;
cont.appendChild(item);
}
}

window.openStoryViewer=function(stories,idx){
activeStories=stories;storyIndex=idx;
document.getElementById('story-viewer').classList.add('act');
renderStory();
};

function renderStory(){
const s=activeStories[storyIndex];if(!s)return closeStoryViewer();
document.getElementById('story-author-name').innerHTML=`${s.profiles?.username} ${s.profiles?.is_verified?'<i class="ph-fill ph-seal-check ver" style="color:#fff"></i>':''}`;
document.getElementById('story-avatar').style.backgroundImage=`url('${s.profiles?.avatar_url||''}')`;
const img=document.getElementById('story-img'),vid=document.getElementById('story-video');
img.style.display='none';vid.style.display='none';vid.pause();
if(s.media_url){
if(s.media_type==='video'){vid.src=s.media_url;vid.style.display='block';vid.play()}
else{img.src=s.media_url;img.style.display='block'}
}
document.getElementById('story-text').textContent=s.text||'';
document.getElementById('story-text').style.display=s.text?'block':'none';
const bar=document.getElementById('story-progress-bar');
bar.style.animation='none';bar.offsetHeight;bar.style.animation='progress 10s linear forwards';
clearTimeout(storyTimer);storyTimer=setTimeout(()=>{storyIndex++;if(storyIndex>=activeStories.length)closeStoryViewer();else renderStory()},10000);
}

window.closeStoryViewer=function(){
document.getElementById('story-viewer').classList.remove('act');
document.getElementById('story-video').pause();
clearTimeout(storyTimer);
};

document.getElementById('story-file').onchange=function(e){
const f=e.target.files[0];if(!f)return;
currentStoryType=f.type.startsWith('video')?'video':'image';
const r=new FileReader();
r.onload=ev=>{currentStoryFile=ev.target.result;document.getElementById('story-file-btn').textContent='Файл выбран ✓'};
r.readAsDataURL(f);
};

document.getElementById('btn-publish-story').onclick=async function(){
const txt=document.getElementById('story-text').value.trim();
if(!currentStoryFile&&!txt)return toast('Добавьте медиа или текст');
this.innerHTML='...';this.disabled=true;
const{error}=await sb.from('stories').insert({user_id:user.id,media_url:currentStoryFile,media_type:currentStoryType,text:txt,visibility:document.getElementById('story-vis').value});
this.innerHTML='Опубликовать';this.disabled=false;
if(error){toast(error.message)}else{
closeModal('mdl-add-story');
currentStoryFile=null;
document.getElementById('story-file-btn').textContent='Выбрать фото/видео';
document.getElementById('story-text').value='';
loadStories();toast('История опубликована!');
}
};

// INIT
if(localStorage.getItem('molju_theme')==='light'){document.body.classList.add('light');document.getElementById('theme-toggle').checked=false}
else{document.getElementById('theme-toggle').checked=true}

sb.auth.getSession().then(({data:{session}})=>{if(!session)showScreen('scr-auth')});

})();
</script>
