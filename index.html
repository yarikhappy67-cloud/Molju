<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Molju — Smart Auth</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
    :root {
        --bg: #050505; --surf: #121212; --surf2: #1c1c1e; --glass: rgba(12, 12, 12, 0.75);
        --brd: rgba(255, 255, 255, 0.08); --txt: #ffffff; --mut: #8e8e93;
        --acc: #ff3b30; --glow: rgba(255, 59, 48, 0.4);
        --grad: linear-gradient(180deg, #ff4d4d 0%, #cc0000 100%);
        --msgM: linear-gradient(180deg, #ff3b30, #cc0000); --msgO: #1c1c1e;
        --ver: #0088cc; --dan: #ff453a;
    }
    body.light-theme {
        --bg: #f0f0f5; --surf: #ffffff; --surf2: #e5e5ea; --glass: rgba(255, 255, 255, 0.8);
        --brd: rgba(0, 0, 0, 0.1); --txt: #000; --mut: #666; --msgO: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { height: 100vh; height: 100dvh; background-color: #000; color: var(--txt); overflow: hidden; display: flex; justify-content: center; }
    .app { position: relative; width: 100%; height: 100%; max-width: 480px; background-color: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

    .global-bg-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.35; pointer-events: none; }
    .app-content { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; }

    @keyframes fI { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sU { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pI { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes sp { 100% { transform: rotate(360deg); } }
    @keyframes spinSaw { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* КНОПКИ */
    .btn-saw {
        position: relative; z-index: 1; background: var(--surf2); color: var(--txt);
        padding: 16px; border-radius: 16px; font-weight: 700; font-size: 16px;
        width: 100%; display: flex; align-items: center; justify-content: center;
        border: none; cursor: pointer; margin-bottom: 12px; overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s;
    }
    .btn-saw::before { content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 250%; background: repeating-conic-gradient(var(--acc) 0deg 6deg, transparent 6deg 12deg); animation: spinSaw 3s linear infinite; z-index: -2; }
    .btn-saw::after { content: ''; position: absolute; inset: 3px; background: inherit; border-radius: 13px; z-index: -1; }
    .btn-saw:active { transform: scale(0.96); }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 0 #8a0000; }
    .btn-huge { padding: 24px; font-size: 20px; margin-bottom: 20px; border-radius: 24px; }
    .btn-huge::after { border-radius: 21px; }

    .inp { width: 100%; padding: 16px; border-radius: 16px; background: var(--surf2); border: 2px solid var(--brd); color: var(--txt); font-size: 16px; outline: none; margin-bottom: 16px; }
    .inp:focus { border-color: var(--acc); }
    .ava { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; background: var(--grad); flex-shrink: 0; background-size: cover; background-position: center; border: 2px solid var(--surf2); }
    .avaS { width: 36px; height: 36px; font-size: 14px; }
    .avaL { width: 96px; height: 96px; font-size: 36px; }
    .ver { color: var(--ver); font-size: 18px; margin-left: 4px; }
    .ld { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; }
    .link-btn { background: none; border: none; color: var(--mut); font-size: 13px; font-weight: 500; margin-top: 10px; cursor: pointer; text-decoration: underline; opacity: 0.8; }
    .link-btn:active { opacity: 1; }

    .scr { position: absolute; inset: 0; display: none; flex-direction: column; background: transparent; z-index: 10; }
    .scr.act { display: flex; animation: fI 0.3s; }
    
    .hdr { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--brd); z-index: 20; }
    .hT { font-size: 22px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .iBtn { width: 40px; height: 40px; border-radius: 50%; background: var(--surf2); font-size: 20px; display: flex; align-items: center; justify-content: center; }
    
    .cnt { flex: 1; overflow-y: auto; padding: 0 16px 100px; position: relative; }
    .tab { display: none; } .tab.act { display: block; animation: fI 0.3s; }

    .sticky-stories { position: sticky; top: 0; background: transparent; z-index: 15; transition: all 0.3s; padding-top: 10px; }
    .sticky-stories.shrink { padding-top: 5px; padding-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background: var(--glass); backdrop-filter: blur(10px); border-radius: 0 0 16px 16px;}
    .sRow { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; transition: all 0.3s; }
    .sRow::-webkit-scrollbar { display: none; }
    .sIt { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px; cursor: pointer; transition: all 0.3s; }
    .sCr { width: 64px; height: 64px; border-radius: 50%; background: var(--surf2); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid transparent; background-size: cover; background-position: center; transition: all 0.3s; }
    .sN { font-size: 11px; color: var(--txt); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; transition: all 0.3s; }
    .sticky-stories.shrink .sCr { width: 40px; height: 40px; font-size: 16px; }
    .sticky-stories.shrink .sN { display: none; }
    .sticky-stories.shrink .sIt { width: 44px; }

    .sBar { width: 100%; padding: 12px 16px; border-radius: 16px; background: var(--surf2); display: flex; align-items: center; gap: 10px; margin: 16px 0; border: 1px solid var(--brd); }
    .sBar input { background: none; border: none; color: var(--txt); width: 100%; outline: none; }
    .lIt { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; cursor: pointer; margin-bottom: 4px; background: var(--surf); border: 1px solid var(--brd);}
    .lIt:active { background: var(--surf2); }
    .lInf { flex: 1; min-width: 0; }
    .lT { font-size: 16px; font-weight: 600; display: flex; align-items: center; }
    .lS { font-size: 14px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--brd); z-index: 30; }
    .nBtn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--mut); font-size: 11px; font-weight: 600; width: 70px; background: transparent !important; border: none; }
    .nBtn.act { color: var(--acc); }
    .nBtn i { font-size: 24px; }

    .cHdr { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--brd); z-index: 20; }
    .bBtn { font-size: 24px; padding: 8px; margin-left: -8px; color: var(--acc); }
    .cHN { font-size: 16px; font-weight: 700; }
    .cHS { font-size: 12px; color: var(--mut); }

    .msgs { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2; }
    .msg { max-width: 85%; padding: 10px 14px; font-size: 15px; position: relative; word-break: break-word; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .msgO { align-self: flex-start; background: var(--msgO); border-radius: 18px 18px 18px 4px; border: 1px solid var(--brd); }
    .msgM { align-self: flex-end; background: var(--msgM); color: #fff; border-radius: 18px 18px 4px 18px; }
    .mT { font-size: 10px; opacity: 0.7; align-self: flex-end; margin-top: 4px; }
    
    .iBar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--brd); display: flex; gap: 10px; align-items: flex-end; z-index: 20; }
    .iBar input { flex: 1; background: var(--surf2); border: 1px solid var(--brd); padding: 16px 20px; border-radius: 24px; color: var(--txt); outline: none; }
    .sBtn { width: 52px; height: 52px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .icon-btn { font-size: 24px; color: var(--mut); padding: 8px; }

    .mdl { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: flex-end; z-index: 300; }
    .mdl.act { display: flex; }
    .mB { width: 100%; background: var(--surf); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); animation: sU 0.3s; max-height: 90vh; overflow-y: auto; }
    .mTit { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
    
    #tst { position: absolute; bottom: 100px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 9999; pointer-events: none; }
    .tMsg { background: var(--surf2); color: var(--txt); padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; border: 1px solid var(--brd); animation: pI 0.2s; }

    #scrAuth { background: var(--bg); z-index: 100; justify-content: center; align-items: center; padding: 24px; }
    .auth-box { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; }
    .logo { font-size: 56px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; }
    .aSt { width: 100%; display: none; flex-direction: column; }
    .aSt.act { display: flex; animation: fI 0.3s; }

    #scrAdmin { background: var(--bg); z-index: 200; }
    #scrAdmin .hdr { background: #0088cc; border: none; }
    #scrAdmin .hT { color: #fff; background: none; -webkit-text-fill-color: #fff; }
    .admin-search-result { margin-top: 20px; display: flex; flex-direction: column; align-items: center; background: var(--surf2); padding: 20px; border-radius: 16px; }

    .switcher-popup { position: absolute; bottom: 80px; left: 16px; right: 16px; background: var(--surf); border: 1px solid var(--brd); border-radius: 20px; padding: 12px; z-index: 400; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); display: none; flex-direction: column; gap: 8px; }
    .switcher-popup.act { display: flex; animation: pI 0.2s; }
    .sw-title { font-size: 12px; color: var(--mut); font-weight: 600; margin-bottom: 4px; padding-left: 8px; }
    .sw-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .sw-item:active { background: var(--surf2); }
    .sw-item.active { background: var(--surf2); border-color: var(--acc); }
    .sw-add { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; border: 1px dashed var(--mut); color: var(--mut); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
<div id="err" style="display:none;position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:10px;z-index:99999;font-size:12px"></div>
<div class="app">
    <img id="globalBgImg" class="global-bg-media" style="display:none;">
    <video id="globalBgVid" class="global-bg-media" style="display:none;" autoplay loop muted playsinline></video>

    <div class="app-content">
        <div id="tst"></div>

        <!-- AUTH -->
        <div id="scrAuth" class="scr act">
        <div class="auth-box">
        <div class="logo">Molju</div>
        
        <!-- Стартовый экран -->
        <div class="aSt act" id="stStart">
            <button class="btn-saw btn-primary btn-huge" onclick="showASt('stLoginEmail')">Войти</button>
            <button class="btn-saw btn-huge" onclick="showASt('stRegEmail')">Регистрация</button>
        </div>

        <!-- Экран Входа -->
        <div class="aSt" id="stLoginEmail">
            <p style="text-align:center;color:var(--mut);margin-bottom:20px">Вход в аккаунт</p>
            <input type="text" id="iLoginIdentifier" class="inp" placeholder="Email или @username">
            <button class="btn-saw btn-primary" id="bLoginCheck">Продолжить</button>
            <button class="link-btn" onclick="showASt('stStart')">Назад</button>
        </div>

        <!-- Экран Регистрации -->
        <div class="aSt" id="stRegEmail">
            <p style="text-align:center;color:var(--mut);margin-bottom:20px">Создание аккаунта</p>
            <input type="email" id="iRegEmail" class="inp" placeholder="Ваш Email">
            <button class="btn-saw btn-primary" id="bRegCheck">Зарегистрироваться</button>
            <button class="link-btn" onclick="showASt('stStart')">Назад</button>
        </div>

        <!-- Ввод пароля -->
        <div class="aSt" id="stPass">
            <p style="text-align:center;color:var(--mut);margin-bottom:20px">Введите пароль для <b id="display-login-email" style="color:var(--txt)"></b></p>
            <input type="password" id="iPass" class="inp" placeholder="Пароль">
            <button class="btn-saw btn-primary" id="bLoginPass">Войти</button>
            <button class="link-btn" id="bForgotPass" style="color:var(--acc)">Забыли пароль?</button>
        </div>

        <!-- Ввод кода -->
        <div class="aSt" id="stO">
            <p style="text-align:center;color:var(--mut);margin-bottom:20px">Код отправлен на <br><b id="dEmail" style="color:var(--txt)"></b></p>
            <input type="text" id="iOtp" class="inp" placeholder="000000" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:5px">
            <button class="btn-saw btn-primary" id="bVerify">Подтвердить</button>
        </div>

        <!-- Создание профиля -->
        <div class="aSt" id="stP">
            <p style="text-align:center;color:var(--mut);margin-bottom:20px">Придумайте профиль</p>
            <input type="text" id="iUser" class="inp" placeholder="@username">
            <input type="text" id="iName" class="inp" placeholder="Имя">
            <input type="password" id="iNewPass" class="inp" placeholder="Пароль (навсегда)">
            <button class="btn-saw btn-primary" id="bSaveProfile">Создать аккаунт</button>
        </div>
        </div>
        </div>

        <!-- MAIN -->
        <div id="scrMain" class="scr">
        <div class="hdr"><div class="hT" id="mTitle">Molju</div><button class="iBtn" onclick="openM('mdlSearch')"><i class="ph ph-magnifying-glass"></i></button></div>
        <div class="cnt tab act" id="tabChats" onscroll="handleScroll(this)">
            <div class="sticky-stories" id="stickyStories"><div class="sRow" id="sCont"></div></div>
            <div class="sBar"><i class="ph ph-magnifying-glass" style="color:var(--mut)"></i><input type="text" id="sInpChats" placeholder="Поиск..."></div>
            <div class="cList" id="cList"></div>
        </div>
        <div class="cnt tab" id="tabSettings">
        <div class="setI" onclick="toggleTheme()" style="padding:16px 0; display:flex; justify-content:space-between; cursor:pointer; border-bottom: 1px solid var(--brd);"><div style="display:flex;align-items:center"><i class="ph ph-moon" style="font-size:22px"></i><div style="margin-left:12px;">Светлая тема</div></div><input type="checkbox" id="tTheme" style="width:20px;height:20px;accent-color:var(--acc)"></div>
        <div class="setI" onclick="openM('mdlWallpaper')" style="padding:16px 0; display:flex; justify-content:space-between; cursor:pointer; border-bottom: 1px solid var(--brd);"><div style="display:flex;align-items:center"><i class="ph ph-image" style="font-size:22px"></i><div style="margin-left:12px;">Обои (Глобальные)</div></div></div>
        </div>
        <div class="cnt tab" id="tabProfile">
        <div style="display:flex;flex-direction:column;align-items:center;margin-top:40px">
        <div class="ava avaL" id="pAva"></div>
        <div style="font-size:24px;font-weight:800;margin-top:16px;display:flex;align-items:center" id="pName">Имя</div>
        <div style="color:var(--mut);margin-top:4px" id="pUser">@username</div>
        <div style="width:100%;margin-top:30px;display:flex;flex-direction:column;gap:12px">
        <button class="btn-saw" onclick="openEditProfile()">Изменить профиль</button>
        <button class="btn-saw" onclick="openSecurityModal()">Безопасность</button>
        <button class="btn-saw btn-primary" id="bAdminPanel" onclick="showScr('scrAdmin')" style="display:none; background: #0088cc; box-shadow: 0 6px 0 #005f8f;">Панель Владельца</button>
        </div>
        <button class="btn-saw" style="margin-top:40px;color:var(--dan); border-color: var(--dan);" id="bLogout">Выйти</button>
        </div>
        </div>
        <div class="nav">
        <button class="nBtn act" onclick="switchTab('tabChats',this)"><i class="ph ph-chats"></i><span>Чаты</span></button>
        <button class="nBtn" onclick="switchTab('tabSettings',this)"><i class="ph ph-gear"></i><span>Настройки</span></button>
        <button class="nBtn" id="navProfileBtn" onclick="switchTab('tabProfile',this)"><i class="ph ph-user"></i><span>Профиль</span></button>
        </div>
        </div>

        <!-- CHAT -->
        <div id="scrChat" class="scr">
        <div class="cHdr"><button class="bBtn" id="bBack"><i class="ph ph-caret-left"></i></button><div class="ava avaS" id="cAva">?</div><div style="flex:1"><div class="cHN" id="cName">Имя</div><div class="cHS" id="cStatus">онлайн</div></div><button class="icon-btn" onclick="clearChatHistory()"><i class="ph ph-trash"></i></button></div>
        <div class="msgs" id="mBox"></div>
        <div class="iBar">
            <button class="icon-btn" onclick="document.getElementById('fileInp').click()"><i class="ph ph-paperclip"></i></button>
            <input type="file" id="fileInp" style="display:none" accept="image/*,video/*" onchange="uploadFile(this)">
            <button class="icon-btn" id="bMic" onclick="simulateVoice()"><i class="ph ph-microphone"></i></button>
            <input type="text" id="mInp" placeholder="Сообщение...">
            <button class="sBtn" id="bSendMsg"><i class="ph ph-paper-plane-right"></i></button>
        </div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="scrAdmin" class="scr">
            <div class="hdr">
                <button class="bBtn" style="color:#fff" onclick="showScr('scrMain')"><i class="ph ph-caret-left"></i></button>
                <div class="hT">Панель Владельца</div>
            </div>
            <div class="cnt" style="padding-top:20px;">
                <button class="btn-saw btn-primary" style="background:#0088cc; box-shadow:0 6px 0 #005f8f;" onclick="broadcastMessage()">Сделать рассылку</button>
                <div class="sBar" style="margin-top:20px;">
                    <i class="ph ph-magnifying-glass" style="color:var(--mut)"></i>
                    <input type="text" id="adminSearch" placeholder="Поиск по @username">
                    <button onclick="searchAdminUser()" style="color:var(--ver); font-weight:700;">Найти</button>
                </div>
                <div id="adminResult"></div>
            </div>
        </div>

        <!-- MODALS -->
        <div id="mdlSearch" class="mdl" onclick="closeM('mdlSearch',event)"><div class="mB"><div class="mTit">Поиск</div><input type="text" id="sInpGlob" class="inp" placeholder="@username"><button class="btn-saw btn-primary" id="bDoSearch">Найти</button></div></div>
        <div id="mdlEditProf" class="mdl" onclick="closeM('mdlEditProf',event)"><div class="mB"><div class="mTit">Профиль</div><div style="display:flex;justify-content:center;margin-bottom:20px"><div class="ava avaL" id="eAvaPrev" onclick="document.getElementById('eAvaInp').click()" style="cursor:pointer"><i class="ph ph-camera"></i></div><input type="file" id="eAvaInp" style="display:none" accept="image/*"></div><input type="text" id="eUser" class="inp" placeholder="@username"><input type="text" id="eName" class="inp" placeholder="Имя"><button class="btn-saw btn-primary" id="bSaveEdit">Сохранить</button></div></div>
        <div id="mdlWallpaper" class="mdl" onclick="closeM('mdlWallpaper',event)"><div class="mB"><div class="mTit">Глобальные обои</div><p style="color:var(--mut); margin-bottom:15px; font-size:14px;">Фото или видео (до 10 сек).</p><button class="btn-saw" style="margin-bottom:10px" onclick="document.getElementById('wallInp').click()">Загрузить</button><input type="file" id="wallInp" style="display:none" accept="image/*,video/*"><button class="btn-saw" onclick="resetWallpaper()">Сбросить</button></div></div>
        <div id="mdlSecurity" class="mdl" onclick="closeM('mdlSecurity',event)"><div class="mB"><div class="mTit">Безопасность</div><p style="color:var(--mut); margin-bottom:20px;">Сессии: <b id="devCount">0</b></p><div id="devList" style="margin-bottom:20px;"></div><button class="btn-saw" style="color:var(--dan)" onclick="terminateAllSessions()">Завершить все</button><button class="btn-saw" onclick="setPasswordProfile()">Установить/Изменить пароль</button></div></div>
    </div>

    <!-- ПЕРЕКЛЮЧАТЕЛЬ АККАУНТОВ -->
    <div class="switcher-popup" id="accountSwitcher">
        <div class="sw-title">Аккаунты</div>
        <div id="accountList"></div>
        <div class="sw-add" onclick="addNewAccount()"><i class="ph ph-plus"></i> Добавить аккаунт</div>
    </div>

</div>

<script>
window.addEventListener('error', function(e) { document.getElementById('err').style.display = 'block'; document.getElementById('err').textContent = 'Ошибка JS: ' + e.message; });

document.addEventListener('DOMContentLoaded', () => {
    const supabase = window.supabase.createClient('https://dhmqbjfzkrmsbrwzenna.supabase.co', 'sb_publishable_UddiQCyX7-rYk12LKAC3zg_NfuzGNcI', { auth: { detectSessionInUrl: true, persistSession: true } });
    const S = { u: null, p: null, cId: null, authEmail: '', loginProfile: null, regEmail: '', activeMsgToCtx: null, adminSearchResult: null };

    window.toast = (m) => { const c = document.getElementById('tst'); const t = document.createElement('div'); t.className = 'tMsg'; t.innerHTML = m; c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000); };
    window.showScr = (id) => { document.querySelectorAll('.scr').forEach(x => x.classList.remove('act')); document.getElementById(id).classList.add('act'); };
    window.showASt = (id) => { document.querySelectorAll('.aSt').forEach(x => x.classList.remove('act')); document.getElementById(id).classList.add('act'); };
    window.switchTab = (id, el) => { document.querySelectorAll('.nBtn').forEach(b => b.classList.remove('act')); el.classList.add('act'); document.querySelectorAll('.tab').forEach(t => t.classList.remove('act')); document.getElementById(id).classList.add('act'); document.getElementById('mTitle').textContent = id === 'tabChats' ? 'Molju' : id === 'tabSettings' ? 'Настройки' : 'Профиль'; };
    window.openM = (id) => document.getElementById(id).classList.add('act');
    window.closeM = (id, e) => { if (e && e.target !== document.getElementById(id)) return; document.getElementById(id).classList.remove('act'); };
    window.toggleTheme = function() { document.body.classList.toggle('light-theme'); localStorage.setItem('molju_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); document.getElementById('tTheme').checked = !document.body.classList.contains('light-theme'); };
    if (localStorage.getItem('molju_theme') === 'light') { document.body.classList.add('light-theme'); document.getElementById('tTheme').checked = true; }

    const hashPass = (p) => btoa(p + 'molju_secret_salt');

    window.handleScroll = (el) => {
        const sticky = document.getElementById('stickyStories');
        if (el.scrollTop > 30) sticky.classList.add('shrink'); else sticky.classList.remove('shrink');
    };

    // ==========================================
    // 1. ВХОД (УМНЫЙ ПОИСК)
    // ==========================================
    document.getElementById('bLoginCheck').onclick = async function() {
        const input = document.getElementById('iLoginIdentifier').value.trim();
        if (!input) return toast('Введите Email или @username');
        
        this.innerHTML = '<div class="ld"></div>'; this.disabled = true;
        
        // Определяем, что ввели: почту или ник
        let query = supabase.from('profiles').select('*');
        if (input.includes('@') && !input.startsWith('@')) {
            query = query.eq('email', input);
        } else {
            query = query.eq('username', input.replace('@', ''));
        }
        
        const { data: p, error } = await query.maybeSingle();
        
        this.innerHTML = 'Продолжить'; this.disabled = false;
        
        if (error || !p) {
            return toast('Аккаунт с такими данными не найден');
        }
        
        S.loginProfile = p;
        S.authEmail = p.email;
        document.getElementById('display-login-email').textContent = p.email;
        showASt('stPass');
    };

    // ==========================================
    // 2. ВХОД ПО ПАРОЛЮ
    // ==========================================
    document.getElementById('bLoginPass').onclick = async function() {
        const pwd = document.getElementById('iPass').value;
        if (!pwd) return toast('Введите пароль');
        
        this.innerHTML = '<div class="ld"></div>'; this.disabled = true;
        
        const { error } = await supabase.auth.signInWithPassword({ email: S.authEmail, password: pwd });
        
        this.innerHTML = 'Войти'; this.disabled = false;
        
        if (error) {
            // Если пароль не совпадает, предлагаем восстановить
            return toast('Неверный пароль. Попробуйте "Забыли пароль?"');
        }
        // Успешный вход произойдет автоматически через onAuthStateChange
    };

    // ==========================================
    // 3. ВОССТАНОВЛЕНИЕ ПАРОЛЯ (ЧЕРЕЗ OTP)
    // ==========================================
    document.getElementById('bForgotPass').onclick = async () => {
        if (!S.authEmail) return;
        
        const btn = document.getElementById('bForgotPass');
        btn.innerHTML = '<div class="ld"></div>'; btn.disabled = true;
        
        const { error } = await supabase.auth.signInWithOtp({ email: S.authEmail });
        
        btn.innerHTML = 'Забыли пароль?'; btn.disabled = false;
        
        if (error) return toast(error.message);
        
        document.getElementById('dEmail').textContent = S.authEmail;
        showASt('stO');
        toast('Код отправлен на ' + S.authEmail);
    };

    // ==========================================
    // 4. РЕГИСТРАЦИЯ
    // ==========================================
    document.getElementById('bRegCheck').onclick = async function() {
        const email = document.getElementById('iRegEmail').value.trim();
        if (!email) return toast('Введите Email');
        
        this.innerHTML = '<div class="ld"></div>'; this.disabled = true;
        
        // Проверяем, есть ли уже такой Email
        const { data: p } = await supabase.from('profiles').select('*').eq('email', email).maybeSingle();
        
        this.innerHTML = 'Зарегистрироваться'; this.disabled = false;
        
        if (p) {
            return toast('Этот Email уже зарегистрирован. Войдите в аккаунт.');
        }
        
        S.authEmail = email;
        const { error } = await supabase.auth.signInWithOtp({ email });
        if (error) return toast(error.message);
        
        document.getElementById('dEmail').textContent = email;
        showASt('stO');
    };

    // ==========================================
    // 5. ПРОВЕРКА OTP КОДА (ПРОСТАЯ, БЕЗ ЗАВИСАНИЙ)
    // ==========================================
    document.getElementById('bVerify').onclick = async function() {
        const code = document.getElementById('iOtp').value.trim();
        if (code.length < 6) return toast('Введите код');
        
        this.innerHTML = '<div class="ld"></div>'; 
        this.disabled = true;
        
        try {
            const { data, error } = await supabase.auth.verifyOtp({ 
                email: S.authEmail, 
                token: code, 
                type: 'email' 
            });
            
            if (error) {
                toast('Ошибка: ' + error.message);
            } else {
                toast('Успешный вход!');
            }
        } catch (err) {
            toast('Ошибка сети: ' + err.message);
        } finally {
            this.innerHTML = 'Подтвердить';
            this.disabled = false;
        }
    };

    supabase.auth.onAuthStateChange(async (ev, ses) => { 
        if (ev === 'SIGNED_IN' && ses) { 
            S.u = ses.user; 
            await checkProf(); 
        } 
    });

    async function checkProf() {
        const { data } = await supabase.from('profiles').select('*').eq('id', S.u.id).single();
        if (data && data.username) {
            S.p = data;
            if (!data.password_hash) { showASt('stP'); return; }
            
            let accounts = JSON.parse(localStorage.getItem('molju_accounts') || '[]');
            accounts = accounts.filter(a => a.id !== data.id);
            accounts.unshift(data);
            localStorage.setItem('molju_accounts', JSON.stringify(accounts));
            
            document.getElementById('pName').innerHTML = `${data.name} ${data.is_verified ? '<i class="ph-fill ph-seal-check ver"></i>' : ''}`;
            document.getElementById('pUser').textContent = '@' + data.username;
            if (data.avatar_url) document.getElementById('pAva').style.backgroundImage = `url('${data.avatar_url}')`;
            document.getElementById('bAdminPanel').style.display = (data.username === 'monk') ? 'flex' : 'none';
            
            applyWallpaper(data.chat_wallpaper, data.chat_wallpaper_type);
            
            showScr('scrMain'); loadChats(); loadStories();
        } else { showASt('stP'); }
    }
    
    document.getElementById('bSaveProfile').onclick = async function() {
        const u = document.getElementById('iUser').value.trim(), n = document.getElementById('iName').value.trim(), pwd = document.getElementById('iNewPass').value;
        if (!u || !n || pwd.length < 6) return toast('Заполните поля (пароль от 6 симв.)');
        await supabase.from('profiles').update({ username: u, name: n, email: S.authEmail, password_hash: hashPass(pwd) }).eq('id', S.u.id); 
        await checkProf();
    };

    // ==========================================
    // 6. 24-ЧАСОВАЯ ЗАЩИТА ПАРОЛЯ
    // ==========================================
    window.setPasswordProfile = async function() {
        if (!S.p) return;
        
        const lastSet = S.p.last_password_set ? new Date(S.p.last_password_set).getTime() : 0;
        const hours = (Date.now() - lastSet) / 36e5;
        
        if (hours < 24) {
            return toast(`Пароль можно изменить только через ${Math.ceil(24 - hours)} ч.`);
        }
        
        const newPwd = prompt('Введите новый пароль:');
        if (!newPwd || newPwd.length < 6) return toast('Пароль от 6 символов');
        
        await supabase.from('profiles').update({ password_hash: hashPass(newPwd), last_password_set: new Date() }).eq('id', S.u.id);
        S.p.password_hash = hashPass(newPwd);
        S.p.last_password_set = new Date();
        toast('Пароль обновлен!');
    };

    // ОСТАЛЬНЫЕ ФУНКЦИИ
    window.toggleStories = function() { /* ... */ };
    window.handleScroll = function(el) { const s = document.getElementById('stickyStories'); if (el.scrollTop > 30) s.classList.add('shrink'); else s.classList.remove('shrink'); };
    
    // ПЕРЕКЛЮЧАТЕЛЬ АККАУНТОВ
    let pressTimer;
    const navProfileBtn = document.getElementById('navProfileBtn');
    navProfileBtn.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { e.preventDefault(); openAccountSwitcher(); }, 500); });
    navProfileBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
    navProfileBtn.addEventListener('touchmove', () => clearTimeout(pressTimer));
    
    window.openAccountSwitcher = function() {
        const popup = document.getElementById('accountSwitcher'); const list = document.getElementById('accountList'); list.innerHTML = '';
        let accounts = JSON.parse(localStorage.getItem('molju_accounts') || '[]');
        if (accounts.length === 0) { popup.classList.add('act'); return; }
        accounts.forEach(acc => {
            const isActive = S.u && acc.id === S.u.id;
            const el = document.createElement('div'); el.className = `sw-item ${isActive ? 'active' : ''}`;
            el.innerHTML = `<div class="ava avaS" style="background-image:url('${acc.avatar_url || ''}')">${acc.avatar_url ? '' : acc.name[0]}</div><div style="flex:1;"><div style="font-weight:700; font-size:14px; display:flex; align-items:center;">${acc.name} ${acc.is_verified ? '<i class="ph-fill ph-seal-check ver" style="font-size:14px;"></i>' : ''}</div><div style="font-size:12px; color:var(--mut);">@${acc.username}</div></div>${isActive ? '<i class="ph-fill ph-check-circle" style="color:var(--acc); font-size:20px;"></i>' : ''}`;
            el.onclick = () => { if (isActive) popup.classList.remove('act'); else switchAccount(acc.email); };
            list.appendChild(el);
        });
        popup.classList.add('act');
    };

    window.addNewAccount = function() { document.getElementById('accountSwitcher').classList.remove('act'); localStorage.removeItem('molju_prefill_email'); logoutFunc(); };
    window.switchAccount = function(email) { document.getElementById('accountSwitcher').classList.remove('act'); localStorage.setItem('molju_prefill_email', email); logoutFunc(); };
    
    document.addEventListener('click', (e) => { const p = document.getElementById('accountSwitcher'); if (p.classList.contains('act') && !p.contains(e.target) && !navProfileBtn.contains(e.target)) p.classList.remove('act'); });

    function logoutFunc() { supabase.auth.signOut().finally(() => { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k.startsWith('sb-')) localStorage.removeItem(k); } window.location.reload(); }); }
    document.getElementById('bLogout').onclick = logoutFunc;

    // Инициализация предзаполнения
    const prefill = localStorage.getItem('molju_prefill_email');
    if (prefill) {
        document.getElementById('iLoginIdentifier').value = prefill;
        localStorage.removeItem('molju_prefill_email');
        showASt('stLoginEmail');
    }

    // ... (вставь сюда остальные функции: applyWallpaper, searchAdminUser, broadcastMessage, loadChats, openChat, uploadFile)
    supabase.auth.getSession().then(({ data: { session } }) => { if (!session) showScr('scrAuth'); });
});
</script>
</body>
</html>
